# Gremlins Mutation Testing Configuration - Docker Adapter
# This config runs mutation testing specifically on the Docker adapter
# with integration tests enabled (requires Docker daemon)
#
# IMPORTANT: The --tags flag must be passed on the command line.
#
# Usage:
#   gremlins unleash ./core/adapters/docker --config .gremlins-docker.yaml --tags integration
#
# Note: This takes ~10 minutes due to integration tests connecting
# to the real Docker daemon for each mutation.
#
# gremlins reads only the keys of its reference configuration
# (https://gremlins.dev/latest/usage/configuration/): settings for
# "gremlins unleash" go under "unleash:", mutators under "mutants:".
# Unknown keys are ignored without a warning. Test files (_test.go) are
# always excluded.

unleash:
  # Run the full test suite for each mutation
  integration: true
  # Higher timeout: integration tests connect to a real Docker daemon
  timeout-coefficient: 10
  # 0 = one worker per CPU
  workers: 0
  # 0 = no CPU limit for each test process
  test-cpu: 0
  # Lower threshold for this specific package
  threshold:
    efficacy: 60

mutants:
  arithmetic-base:
    enabled: true
  conditionals-boundary:
    enabled: true
  conditionals-negation:
    enabled: true
  increment-decrement:
    enabled: true
  invert-negatives:
    enabled: true
