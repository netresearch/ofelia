name: bad
jobs:
  plain:
    image: alpine:3.22
    triggers:
      schedule:
        - "0 2 * * *"
  missed_one:
    image: alpine:3.22
    triggers:
      schedule:
        - cron: "0 2 * * *"
          missed_fires: one
  queued:
    image: alpine:3.22
    triggers:
      schedule:
        - cron: "0 2 * * *"
          concurrency: queue
          missed_fires: skip
  twice:
    image: alpine:3.22
    triggers:
      schedule:
        - cron: "0 2 * * *"
          missed_fires: skip
        - cron: "0 3 * * *"
          missed_fires: skip
  no_manual:
    image: alpine:3.22
    triggers:
      manual: false
      schedule:
        - cron: "0 2 * * *"
          missed_fires: skip
  dep_no_manual:
    image: alpine:3.22
    depends_on:
      locked:
        condition: service_completed_successfully
    triggers:
      schedule:
        - cron: "0 2 * * *"
          missed_fires: skip
  locked:
    image: alpine:3.22
    triggers:
      manual: false
  six_fields:
    image: alpine:3.22
    triggers:
      schedule:
        - cron: "0 0 2 * * *"
          missed_fires: skip
  bad_zone:
    image: alpine:3.22
    triggers:
      schedule:
        - cron: "0 2 * * *"
          timezone: Mars/Olympus
          missed_fires: skip
  bad_value:
    image: alpine:3.22
    triggers:
      schedule:
        - cron: "61 2 * * *"
          missed_fires: skip
