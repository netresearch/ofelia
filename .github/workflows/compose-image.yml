#
# Publishes the compose variant of the container image: the default image plus
# the docker CLI and the Compose plugin that job-compose shells out to. It is
# the `compose` target of the Dockerfile, pushed to the same image as the
# default one under `-compose` tags (`1.2.3-compose`, `1.2-compose`,
# `1-compose`, `latest-compose`).
#
# Not part of release.yml: that file is template-managed (check-template-drift)
# and its orchestrator (release-go-app.yml) builds exactly one image without a
# target or a tag suffix. This workflow runs after it, from the binaries the
# release published, through the org's build-container.yml.
#
# TRIGGER: the completion of the Release workflow, NOT `release: published` —
# the release is created with GITHUB_TOKEN, which raises no events (see
# verify-release.yml). On pull requests that touch the Dockerfile or this file
# the variant is built and run once, without pushing.

name: Compose Image

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the compose variant for (e.g. v1.2.3). The tag must contain the Dockerfile's compose target."
        type: string
        required: true
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/compose-image.yml

permissions: {}

concurrency:
  group: compose-image-${{ github.event.workflow_run.head_branch || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Builds the variant for amd64 and checks that the CLI and the plugin run.
  smoke:
    name: Smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -o bin/ofelia-linux-amd64 .

      - name: Build compose variant
        run: docker build --platform linux/amd64 --target compose -t ofelia:compose-smoke .

      - name: Run docker CLI and Compose plugin
        run: |
          set -euo pipefail
          docker run --rm --entrypoint docker ofelia:compose-smoke --version
          docker run --rm --entrypoint docker ofelia:compose-smoke compose version
          docker run --rm ofelia:compose-smoke --version

  # The container tags drop the leading "v" of the release tag. A prerelease
  # gets only its full version, like the default image (docker/metadata-action
  # emits no major/minor tags for a prerelease).
  refs:
    name: Resolve tags
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      metadata-tags: ${{ steps.resolve.outputs.metadata-tags }}
      checksums-sha256: ${{ steps.verify.outputs.checksums-sha256 }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Resolve tag and image tags
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$RUN_TAG}"
          # The tag becomes a git ref and image tags; accept only vMAJOR.MINOR.PATCH
          # with an optional prerelease suffix.
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag of the form vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PRERELEASE="${BASH_REMATCH[4]}"
          VERSION="${TAG#v}"
          # A floating tag moves only when this tag is the highest stable
          # release in its scope, so an older-line patch or a re-run for an
          # old tag cannot move it backwards.
          STABLE="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts \
            --limit 1000 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)"
          highest() { printf '%s\n' "$STABLE" | grep -E "^$1" | tail -n 1; }
          {
            echo "tag=$TAG"
            echo 'metadata-tags<<EOM'
            # type=raw only: docker/metadata-action adds an unsuffixed `latest`
            # for type=semver tags, which would overwrite the default image's.
            echo "type=raw,value=${VERSION}-compose"
            if [ -z "$PRERELEASE" ]; then
              [ "$(highest "v${MAJOR}\\.${MINOR}\\.")" = "$TAG" ] && echo "type=raw,value=${MAJOR}.${MINOR}-compose"
              [ "$(highest "v${MAJOR}\\.")" = "$TAG" ] && echo "type=raw,value=${MAJOR}-compose"
              [ "$(highest "v")" = "$TAG" ] && echo "type=raw,value=latest-compose"
            fi
            echo 'EOM'
          } >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Release assets are not immutable. Verify the signed checksums file here
      # and pin its digest, so the build step can check the binaries it
      # downloads against exactly this file.
      - name: Verify release checksums signature
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify \
            --pattern checksums.txt --pattern checksums.txt.sigstore.json
          cosign verify-blob --bundle verify/checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/netresearch/\.github/\.github/workflows/release-go-app\.yml@refs/heads/main$' \
            verify/checksums.txt
          echo "checksums-sha256=$(sha256sum verify/checksums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: refs
    uses: netresearch/.github/.github/workflows/build-container.yml@main
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image-name: ofelia
      ref: ${{ needs.refs.outputs.tag }}
      target: compose
      platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
      # The Dockerfile copies the pre-built binaries from bin/; take the ones
      # the release published. The checkout is the release tag itself. The
      # checksums file must be the one whose signature the refs job verified,
      # and every binary must match it.
      pre-build-command: |
        set -euo pipefail
        TAG="$(git describe --tags --exact-match HEAD)"
        gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir bin \
          --pattern checksums.txt \
          --pattern ofelia-linux-386 --pattern ofelia-linux-amd64 --pattern ofelia-linux-arm64 \
          --pattern ofelia-linux-armv6 --pattern ofelia-linux-armv7
        cd bin
        echo "${{ needs.refs.outputs.checksums-sha256 }}  checksums.txt" | sha256sum -c -
        grep -E '  ofelia-linux-(386|amd64|arm64|armv6|armv7)$' checksums.txt > selected.sha256
        [ "$(wc -l < selected.sha256)" -eq 5 ]
        sha256sum -c selected.sha256
        rm checksums.txt selected.sha256
        chmod +x ofelia-linux-*
        ls -la
      metadata-tags: ${{ needs.refs.outputs.metadata-tags }}
      metadata-labels: |
        org.opencontainers.image.title=Ofelia (compose)
        org.opencontainers.image.description=A docker job scheduler (based on mcuadros/ofelia), with the docker CLI and Compose plugin for job-compose
      cache-scope: compose-image
      scan: true
      sign: true
      attest: true
