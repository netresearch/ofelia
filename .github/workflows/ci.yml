name: CI

on:
  push:
    branches: [main, master]
    tags: ['**']
  pull_request:
    branches: [main, master]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go-check:
    uses: netresearch/.github/.github/workflows/go-check.yml@main
    with:
      enable-tool-build-cache: true
      enable-smoke-fast-feedback: true
      enable-fuzz: true
      enable-license-check: true
      enable-codecov: true
      enable-test-results: true
      enable-integration-tests: true
      enable-e2e-tests: true
      e2e-test-packages: ./e2e/...
      coverage-threshold: 80.0
    permissions:
      contents: read
      security-events: write
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
