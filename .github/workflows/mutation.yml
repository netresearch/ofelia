name: Mutation Testing

on:
  schedule:
    - cron: '0 2 * * 0'
  pull_request:
    paths:
      - '**.go'
      - '.gremlins.yaml'
      - '.github/workflows/mutation.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    uses: netresearch/.github/.github/workflows/go-mutation-testing.yml@main
    with:
      diff-only: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
