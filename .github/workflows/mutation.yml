name: Mutation Testing

on:
  schedule:
    - cron: '0 2 * * 0'
  pull_request:
    paths:
      - '**.go'
      - '.gremlins.yaml'
      - '.github/workflows/mutation.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    uses: netresearch/.github/.github/workflows/go-mutation-testing.yml@main
    with:
      diff-only: ${{ github.event_name == 'pull_request' }}
      # The core tests used to need between 3.5 and 4 GiB of address space per
      # test binary: two parallel EnhancedBufferPool tests each prewarmed the
      # default pool, about 888 MB. Even 4 GiB failed 1 of about 20 CI runs.
      # Those tests no longer prewarm 10 MB buffers, and the core package then
      # passed 10 of 10 local runs under 3 GiB with GOMAXPROCS=4 (before: 5 of
      # 10 failed). 4 GiB stays as the margin; 4 workers x 4 GiB stays within
      # the 16 GB of a hosted runner, which the limit exists to protect.
      test-memory-limit-mb: 4096
    permissions:
      contents: read
      pull-requests: write
