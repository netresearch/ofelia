# Gremlins Mutation Testing Configuration
# https://gremlins.dev/latest/usage/configuration/
#
# gremlins reads only the keys of its reference configuration: settings
# for "gremlins unleash" go under "unleash:", mutators under "mutants:".
# Unknown keys are ignored without a warning.

unleash:
  # Build tags. Integration tests are NOT part of the main run, because they
  # connect to a real Docker daemon and would time out every package.
  #
  # For Docker adapter mutation testing WITH integration tests, use:
  #   gremlins unleash ./core/adapters/docker --config .gremlins-docker.yaml --tags integration
  tags: ""

  # Machine-readable report, uploaded by the CI workflow as an artifact.
  output: mutation-report.json

  # 0 = one worker per CPU.
  workers: 0
  # 0 = no CPU limit for each test process.
  test-cpu: 0
  # Multiplier for the per-mutant test timeout.
  timeout-coefficient: 5

  # gremlins exits with code 10 when the efficacy is at or below this value.
  # The shared CI workflow accepts that code, so it marks the score and does
  # not fail the job.
  threshold:
    efficacy: 60

  # Regular expressions matched against the path relative to the module
  # root. Test files (_test.go) are always excluded.
  exclude-files:
    - "(^|/)test/"       # Test helpers
    - "(^|/)static/"     # Static assets
    - "(^|/)mock/"       # Mock implementations and mock adapters

mutants:
  arithmetic-base:
    enabled: false
  conditionals-boundary:
    enabled: true        # < to <=, > to >=, ...
  conditionals-negation:
    enabled: true        # == to !=, ...
  increment-decrement:
    enabled: true        # ++ to -- and back
  invert-logical:
    enabled: true        # && to ||, || to &&
  invert-negatives:
    enabled: true        # -x to x
  invert-loopctrl:
    enabled: true        # break to continue and back
