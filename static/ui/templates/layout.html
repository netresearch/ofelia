<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ofelia</title>
  <link rel="stylesheet" href="pico.min.css">
  <script>
    /* Apply saved preferences before first paint to avoid flash.
       ofeliaEffectiveDensity (device heuristic + auto mapping) is shared
       with app.js (applyDensity), so first paint and later toggles use
       the same rule. app.js carries a fallback copy so a blocked inline
       script degrades to a density mismatch, not a dead dashboard. */
    (function() {
      globalThis.ofeliaEffectiveDensity = function (pref) {
        if (pref !== 'auto') return pref;
        // Device prefers comfortable: touch screen, narrow viewport, or
        // prefers-reduced-motion.
        var wantsComfortable =
          globalThis.matchMedia('(pointer: coarse)').matches ||
          globalThis.matchMedia('(max-width: 600px)').matches ||
          globalThis.matchMedia('(prefers-reduced-motion: reduce)').matches;
        return wantsComfortable ? 'comfortable' : 'compact';
      };
      /* Stored values are validated (a value written by another app
         version or a manual edit must not leak into dataset.theme or
         the density resolution); app.js validates its reads the same
         way.

         The reads are guarded because a browser with site data blocked
         (a privacy setting, a hardened profile) throws on the
         localStorage property itself, not just on write. An unguarded
         throw here happens before first paint and takes the theme and
         density defaults with it, so the guard degrades to "nothing
         stored" — the same path a first-time visitor takes. */
      var t = null, d = null;
      try {
        t = localStorage.getItem('theme');
        d = localStorage.getItem('density');
      } catch (e) { /* site data blocked: fall back to the defaults */ }
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      if (d !== 'compact' && d !== 'comfortable') d = 'auto';
      var eff = globalThis.ofeliaEffectiveDensity(d);
      if (eff === 'compact') document.body ? document.body.classList.add('compact') : document.documentElement.classList.add('compact-early');
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="app-nav">
    <div class="brand"><strong>Ofelia</strong> <small>by <a href="https://github.com/netresearch/ofelia" target="_blank" rel="noopener">Netresearch</a></small></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="btn-jobs" class="active" data-tab="jobs" aria-selected="true" aria-controls="tab-jobs">Jobs<span id="badgeJobs" class="tab-badge">0</span></button>
      <button role="tab" id="btn-form" data-tab="form" aria-selected="false" aria-controls="tab-form">Create / Edit</button>
      <button role="tab" id="btn-removed" data-tab="removed" aria-selected="false" aria-controls="tab-removed">Removed<span id="badgeRemoved" class="tab-badge muted" style="display:none">0</span></button>
      <button role="tab" id="btn-config" data-tab="config" aria-selected="false" aria-controls="tab-config">Config</button>
    </div>
    <div class="nav-right">
      <small id="jobCount"></small>
      <div class="nav-controls">
        <select id="timezoneSelect" aria-label="Time zone" data-custom-tooltip="How timestamps are displayed">
          <option value="local">🕐 Browser</option>
          <option value="server">🖥 Server</option>
          <option value="utc">🌐 UTC</option>
        </select>
        <button id="themeBtn" class="nav-btn" aria-label="Toggle theme"></button>
        <button id="densityBtn" class="nav-btn" aria-label="Toggle density"></button>
      </div>
    </div>
  </nav>

  <main class="container">
    {{template "tabs-jobs.html" .}}
    {{template "tabs-form.html" .}}
    {{template "tabs-removed.html" .}}
    {{template "tabs-config.html" .}}
  </main>

  <footer class="app-footer">
    <div class="footer-inner">
      <span>&copy; Netresearch DTT GmbH &middot; MIT License &middot; Originally by M&aacute;ximo Cuadros &middot; <span id="footer-version"></span></span>
      <div class="footer-links">
        <a href="https://github.com/netresearch/ofelia" target="_blank" rel="noopener">GitHub</a>
        <span class="sep">&middot;</span>
        <a href="https://github.com/netresearch/ofelia/issues" target="_blank" rel="noopener">Issues</a>
        <span class="sep">&middot;</span>
        <a href="https://github.com/netresearch/ofelia/discussions" target="_blank" rel="noopener">Discussions</a>
        <span class="sep">&middot;</span>
        <a href="https://github.com/netresearch/ofelia/blob/main/README.md" target="_blank" rel="noopener">Docs</a>
      </div>
    </div>
  </footer>

  <!-- Last in the body: app.js queries elements at top level (footer-version
       among them), so every element it touches must already be parsed. -->
  <script src="app.js"></script>
</body>
</html>
