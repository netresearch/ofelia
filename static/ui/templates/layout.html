<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ofelia</title>
  <link rel="stylesheet" href="pico.min.css">
  <script>
    /* Apply saved preferences before first paint to avoid flash */
    (function() {
      var t = localStorage.getItem('theme');
      if (t && t !== 'auto') document.documentElement.dataset.theme = t;
      var d = localStorage.getItem('density') || 'auto';
      var coarse = globalThis.matchMedia('(pointer: coarse)').matches;
      var narrow = globalThis.matchMedia('(max-width: 600px)').matches;
      var reduce = globalThis.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var eff = d;
      if (d === 'auto') eff = (coarse || narrow || reduce) ? 'comfortable' : 'compact';
      if (eff === 'compact') document.body ? document.body.classList.add('compact') : document.documentElement.classList.add('compact-early');
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <ul><li><div class="brand"><strong>Ofelia</strong> <small>by <a href="https://github.com/netresearch/ofelia" target="_blank" rel="noopener">Netresearch</a></small></div></li></ul>
    <ul>
      <li><small id="jobCount"></small></li>
      <li>
        <div class="nav-controls">
          <select id="timezoneSelect" aria-label="Time zone" title="How timestamps are displayed">
            <option value="local">🕐 Browser</option>
            <option value="server">🖥 Server</option>
            <option value="utc">🌐 UTC</option>
          </select>
          <button id="themeBtn" class="nav-btn" aria-label="Toggle theme" title="Theme: system"></button>
          <button id="densityBtn" class="nav-btn" aria-label="Toggle density" title="Density: compact"></button>
        </div>
      </li>
    </ul>
  </nav>

  <main class="container">
    <div class="tabs" role="tablist">
      <button role="tab" id="btn-jobs" class="active" data-tab="jobs" aria-selected="true" aria-controls="tab-jobs">Jobs<span id="badgeJobs" class="tab-badge">0</span></button>
      <button role="tab" id="btn-form" data-tab="form" aria-selected="false" aria-controls="tab-form">Create / Edit</button>
      <button role="tab" id="btn-removed" data-tab="removed" aria-selected="false" aria-controls="tab-removed">Removed<span id="badgeRemoved" class="tab-badge muted" style="display:none">0</span></button>
      <button role="tab" id="btn-config" data-tab="config" aria-selected="false" aria-controls="tab-config">Config</button>
    </div>

    {{template "tabs-jobs.html" .}}

    {{template "tabs-form.html" .}}

    {{template "tabs-removed.html" .}}

    {{template "tabs-config.html" .}}
  </main>

  <script src="app.js"></script>

  <footer class="container">
    <div class="footer-inner">
      <span>&copy; Netresearch DTT GmbH &middot; MIT License &middot; Originally by M&aacute;ximo Cuadros</span>
      <div class="footer-links">
        <a href="https://github.com/netresearch/ofelia" target="_blank" rel="noopener">GitHub</a>
        <span class="sep">&middot;</span>
        <a href="https://github.com/netresearch/ofelia/issues" target="_blank" rel="noopener">Issues</a>
        <span class="sep">&middot;</span>
        <a href="https://github.com/netresearch/ofelia/discussions" target="_blank" rel="noopener">Discussions</a>
        <span class="sep">&middot;</span>
        <a href="https://github.com/netresearch/ofelia/blob/main/README.md" target="_blank" rel="noopener">Docs</a>
      </div>
    </div>
  </footer>
</body>
</html>
