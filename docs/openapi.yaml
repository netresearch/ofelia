openapi: 3.0.3
info:
  title: Ofelia Job Scheduler API
  description: >-
    REST API of the Ofelia web server (--enable-web). Paths mirror the route
    table in web/server.go; docs/API.md carries the narrative version.
  version: 1.3.0
  contact:
    name: Ofelia Support
    url: https://github.com/netresearch/ofelia
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8081
    description: Local ofelia web server (default --web-address)

security:
  - BearerAuth: []
  - CookieAuth: []

paths:
  /api/login:
    post:
      summary: Authenticate (only registered when web auth is enabled)
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string}
      responses:
        "200":
          description: Authenticated; auth_token cookie is set alongside the JSON body
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  csrf_token: {type: string}
                  expires_in: {type: number, description: seconds}
        "401": {$ref: "#/components/responses/PlainError"}
        "429": {$ref: "#/components/responses/PlainError"}
  /api/logout:
    post:
      summary: Clear the auth cookie
      tags: [Authentication]
      responses:
        "204": {description: Logged out}
  /api/auth/status:
    get:
      summary: Whether auth is enabled and the caller is authenticated
      tags: [Authentication]
      security: []
      responses:
        "200": {description: Status object}
  /api/csrf-token:
    get:
      summary: CSRF token for the session (used by the login form)
      tags: [Authentication]
      security: []
      responses:
        "200": {description: Token object}

  /api/jobs:
    get:
      summary: List active jobs
      tags: [Jobs]
      responses:
        "200":
          description: Array of jobs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Job"}
  /api/jobs/removed:
    get:
      summary: List jobs removed from the configuration
      tags: [Jobs]
      responses:
        "200":
          description: Array of jobs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Job"}
  /api/jobs/disabled:
    get:
      summary: List disabled (paused) jobs
      tags: [Jobs]
      responses:
        "200":
          description: Array of jobs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Job"}
  /api/jobs/{jobName}/history:
    get:
      summary: Execution history of one job
      tags: [Jobs]
      parameters:
        - name: jobName
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Array of executions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Execution"}
        "404": {$ref: "#/components/responses/PlainError"}

  /api/jobs/run:
    post:
      summary: Trigger a job now
      tags: [Job mutations]
      requestBody: {$ref: "#/components/requestBodies/JobName"}
      responses:
        "204": {description: Job triggered}
        "400": {$ref: "#/components/responses/PlainError"}
        "404": {$ref: "#/components/responses/PlainError"}
        "405": {$ref: "#/components/responses/PlainError"}
        "500": {$ref: "#/components/responses/PlainError"}
  /api/jobs/disable:
    post:
      summary: Disable (pause) a job of any origin; persisted across restarts
      tags: [Job mutations]
      requestBody: {$ref: "#/components/requestBodies/JobName"}
      responses:
        "204": {description: Job disabled}
        "400": {$ref: "#/components/responses/PlainError"}
        "404": {$ref: "#/components/responses/PlainError"}
        "405": {$ref: "#/components/responses/PlainError"}
        "500": {$ref: "#/components/responses/PlainError"}
  /api/jobs/enable:
    post:
      summary: Re-enable a disabled job
      tags: [Job mutations]
      requestBody: {$ref: "#/components/requestBodies/JobName"}
      responses:
        "204": {description: Job enabled}
        "400": {$ref: "#/components/responses/PlainError"}
        "404": {$ref: "#/components/responses/PlainError"}
        "405": {$ref: "#/components/responses/PlainError"}
        "500": {$ref: "#/components/responses/PlainError"}
  /api/jobs/create:
    post:
      summary: Create a job (persisted across restarts)
      tags: [Job mutations]
      requestBody: {$ref: "#/components/requestBodies/JobRequest"}
      responses:
        "201": {description: Job created}
        "400": {$ref: "#/components/responses/PlainError"}
        "403":
          description: >-
            The name is owned by INI/label config; edit the source or use
            /api/jobs/disable. Gated on the name, not on a registered job: a
            config job with an empty or malformed schedule holds no cron entry.
        "405": {$ref: "#/components/responses/PlainError"}
  /api/jobs/update:
    post:
      summary: Update a job (full replace; creates it when missing)
      tags: [Job mutations]
      requestBody: {$ref: "#/components/requestBodies/JobRequest"}
      responses:
        "200": {description: Job updated}
        "201": {description: Job did not exist and was created}
        "400": {$ref: "#/components/responses/PlainError"}
        "403":
          description: Job is owned by INI/label config; edit the source or use /api/jobs/disable
        "405": {$ref: "#/components/responses/PlainError"}
        "500": {$ref: "#/components/responses/PlainError"}
  /api/jobs/delete:
    post:
      summary: Delete an API/web-created job
      tags: [Job mutations]
      requestBody: {$ref: "#/components/requestBodies/JobName"}
      responses:
        "204": {description: Job deleted}
        "400": {$ref: "#/components/responses/PlainError"}
        "403":
          description: Job is owned by INI/label config; edit the source or use /api/jobs/disable
        "404": {$ref: "#/components/responses/PlainError"}
        "405": {$ref: "#/components/responses/PlainError"}

  /api/dashboard:
    get:
      summary: Aggregate snapshot for polling clients
      description: >-
        The three job lists, the stripped configuration and — with the history
        parameter — that job's executions, from a single moment in time.
        Additive: the per-resource endpoints are unchanged. Exists so a polling
        client (the bundled web UI polls every five seconds) spends one request
        per tick instead of four or five.
      tags: [Jobs]
      parameters:
        - name: history
          in: query
          required: false
          description: Include this job's executions in the history field
          schema: {type: string}
        - name: historyFp
          in: query
          required: false
          description: >-
            The historyFingerprint from a previous response. When it still
            matches, history is omitted from this one — the client already holds
            those runs. Omit the parameter to always receive the full history.
          schema: {type: string}
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Dashboard"}

  /api/config:
    get:
      summary: Running configuration (job collections stripped)
      tags: [Configuration]
      responses:
        "200": {description: Configuration object}

  /health:
    get:
      summary: Aggregate health report
      tags: [Health]
      security: []
      responses:
        "200": {description: Healthy}
        "503": {description: Unhealthy}
  /healthz:
    get:
      summary: Alias of /health
      tags: [Health]
      security: []
      responses:
        "200": {description: Healthy}
        "503": {description: Unhealthy}
  /ready:
    get:
      summary: Readiness probe
      tags: [Health]
      security: []
      responses:
        "200": {description: Ready}
        "503": {description: Not ready}
  /live:
    get:
      summary: Liveness probe
      tags: [Health]
      security: []
      responses:
        "200": {description: Alive}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
  requestBodies:
    JobName:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: {type: string, maxLength: 256}
    JobRequest:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/JobRequest"}
  responses:
    PlainError:
      description: Plain-text error message
      content:
        text/plain:
          schema: {type: string}
  schemas:
    JobRequest:
      type: object
      required: [name, type]
      properties:
        name: {type: string, maxLength: 256}
        type: {type: string, enum: [run, exec, local, service-run, compose]}
        schedule: {type: string}
        command: {type: string}
        image: {type: string, description: run jobs}
        container: {type: string, description: exec jobs}
        file: {type: string, description: compose jobs}
        service: {type: string, description: service-run jobs}
        exec: {type: boolean, description: "compose jobs: exec in a running service"}
    Job:
      type: object
      properties:
        name: {type: string}
        type: {type: string}
        schedule: {type: string}
        command: {type: string}
        running: {type: boolean}
        lastRun: {$ref: "#/components/schemas/Execution"}
        nextRuns:
          type: array
          items: {type: string, format: date-time}
        prevRuns:
          type: array
          items: {type: string, format: date-time}
        origin: {type: string, enum: [ini, label, api, web]}
        config: {type: object, description: full job configuration}
        recentRuns:
          type: array
          description: >-
            Up to the ten newest executions, oldest first, without output — a
            list view can render outcome history without one history request per
            job. Omitted for job types that keep no history.
          items: {$ref: "#/components/schemas/RecentRun"}
    RecentRun:
      type: object
      properties:
        date: {type: string, format: date-time}
        duration: {type: integer, description: nanoseconds}
        failed: {type: boolean}
        skipped: {type: boolean}
    Dashboard:
      type: object
      description: Aggregate snapshot of the job lists, the configuration and one job's history
      properties:
        jobs:
          type: array
          items: {$ref: "#/components/schemas/Job"}
        disabled:
          type: array
          items: {$ref: "#/components/schemas/Job"}
        removed:
          type: array
          items: {$ref: "#/components/schemas/Job"}
        config: {type: object, description: same payload as GET /api/config}
        history:
          type: array
          nullable: true
          description: >-
            Executions of the job named in the history query parameter. Null
            when the parameter is absent or names no job; an empty array for an
            existing job without executions.
          items: {$ref: "#/components/schemas/Execution"}
        historyFingerprint:
          type: string
          description: >-
            Identity of the requested job's executions. Echo it as the historyFp
            query parameter to have an unchanged history omitted. Absent when no
            history was requested or the job does not exist.
    Execution:
      type: object
      properties:
        date: {type: string, format: date-time}
        duration: {type: integer, description: nanoseconds}
        failed: {type: boolean}
        skipped: {type: boolean}
        error: {type: string}
        stdout: {type: string}
        stderr: {type: string}
